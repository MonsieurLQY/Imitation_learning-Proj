interpolation_node:
  ros__parameters:
    # 每个列表依次对应 7 个关节。数值越大，MPC 越重视压低该项误差/代价。
    # 入门阶段先理解四类权重的用途，不要在真机运行时直接试改参数。
    mpc_weights:
      # 目标位置跟踪误差权重
      position: [4.05, 4.05, 4.05, 4.05, 4.05, 4.05, 4.05]
      # 关节速度代价权重
      velocity: [3.0e-2, 3.0e-2, 3.0e-2, 3.0e-2, 3.0e-2, 3.0e-2, 3.0e-2]
      # 关节加速度代价权重
      acceleration: [1.25e-5, 1.25e-5, 1.25e-5, 1.25e-5, 1.25e-5, 1.25e-5, 1.25e-5]
      # 控制输入（本模型中用于改变加速度的量）代价权重
      control: [8e-9, 8e-9, 8e-9, 8e-9, 8e-9, 8e-9, 8e-9]
